schema_version: "1.1"
name: dalej-continues
description: Moduł w toku jest kontynuowany, nie przeskakiwany.
runs: 2
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: /stepkit:dalej
context:
  scaffold_script: fixture.sh
graders:
  - name: continues-login
    type: llm
    criteria: Odpowiedź (po polsku) mówi, że kontynuujemy moduł Logowanie od kroku 3 planu (trasa logowania). Nie zaczyna modułu Klienci i nie proponuje go jako następnego kroku teraz.
