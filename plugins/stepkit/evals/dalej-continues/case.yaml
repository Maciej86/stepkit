schema_version: "1.1"
name: dalej-continues
description: Moduł w toku jest kontynuowany, nie przeskakiwany.
runs: 2
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: "Środowisko testowe stepkit: komendy (npm, docker, git) są niedostępne, a node_modules nie są zainstalowane. Zakładaj, że npm run check przechodzi po poprawnych zmianach, i pracuj dalej na plikach."
  prompt: /stepkit:dalej
context:
  scaffold_script: fixture.sh
graders:
  - name: continues-login
    type: llm
    criteria: Odpowiedź po polsku zajmuje się modułem Logowanie i jego krokiem 3 (trasa logowania), czyli albo go zaczyna, albo wyjaśnia, co trzeba naprawić, zanim go zacznie. Nie zaczyna modułu Klienci i nie proponuje przejścia do Klientów.
