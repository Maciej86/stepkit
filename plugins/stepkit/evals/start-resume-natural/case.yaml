schema_version: "1.1"
name: start-resume-natural
description: Powrót do planowania zwykłym zdaniem (bez komendy) wraca do pierwszego nieodhaczonego kroku, tu podsumowania.
runs: 5
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: "Środowisko testowe stepkit: komendy (npm, docker, git) są niedostępne, a node_modules nie są zainstalowane."
  prompt: "Wracam do planowania mojej aplikacji urlopowej. Działajmy dalej."
context:
  scaffold_script: fixture.sh
graders:
  - name: resumes-at-summary
    type: llm
    criteria: Odpowiedź po polsku, prostym językiem, mówi krótko, na czym skończono (wywiad zrobiony), i jest na etapie podsumowania wywiadu aplikacji urlopowej. Zalicza się (a) podsumowanie ustaleń (role, dane, główna czynność itd.) z prośbą o akceptację albo poprawki, albo (b) jedno pytanie o rzecz, której brakuje w notatkach z wywiadu (np. sposób logowania), zadane przed podsumowaniem albo razem z nim. Nie zalicza się, gdy zaczyna makietę albo spec, pyta ponownie o opis aplikacji, zaczyna wywiad od nowa, zadaje kilka pytań naraz albo powtarza sprawdzanie komputera lub powitanie z listą narzędzi.
