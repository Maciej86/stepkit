schema_version: "1.1"
name: dalej-pause
description: Przejście do innego modułu wymaga potwierdzenia i wstrzymuje bieżący.
runs: 2
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/stepkit:dalej wolałbym najpierw zrobić Raporty"
context:
  scaffold_script: fixture.sh
graders:
  - name: asks-and-pauses
    type: llm
    criteria: Odpowiedź po polsku wyjaśnia skutki (moduł Klienci zostanie wstrzymany na etapie spec i wróci jako pierwszy), prosi użytkownika o potwierdzenie przed przejściem do Raportów i jeszcze nie zaczyna pracy nad Raportami.
