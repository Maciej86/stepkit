schema_version: "1.1"
name: dalej-fixes-wait
description: Moduł w toku ma pierwszeństwo przed niepilną poprawką z FIXES.md.
runs: 2
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: "Środowisko testowe stepkit: komendy (npm, docker, git) są niedostępne, a node_modules nie są zainstalowane. Zakładaj, że npm run check przechodzi po poprawnych zmianach, i pracuj dalej na plikach."
  prompt: /stepkit:dalej
context:
  scaffold_script: fixture.sh
graders:
  - name: continues-login
    type: llm
    criteria: Odpowiedź po polsku kontynuuje moduł Logowanie od kroku 3 (trasa logowania) albo wyjaśnia, że teraz zajmie się tym krokiem. Nie zaczyna poprawki z FIXES.md (link „Nie pamiętasz hasła?”) przed dokończeniem Logowania; może co najwyżej wspomnieć, że zrobi ją po zamknięciu modułu. Nie zaczyna modułu Klienci.
