schema_version: "1.1"
name: dalej-mockup-design
description: Makieta modułu ma pytania w panelu na górze ekranu i trzyma się wspólnego motywu.
runs: 2
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  append_system_prompt: "Środowisko testowe stepkit: komendy (npm, docker, git) są niedostępne, a node_modules nie są zainstalowane. Zakładaj, że npm run check przechodzi po poprawnych zmianach, i pracuj dalej na plikach."
  prompt: /stepkit:dalej
context:
  scaffold_script: fixture.sh
graders:
  # Uwaga: skill frontend-design nie jest dostępny w piaskownicy evali (ładuje się tylko stepkit), więc jego wywołania
  # nie da się tu sprawdzić. Sprawdzane na żywo w ~/www/test.
  - name: questions-on-top
    type: regex
    pattern: 'na górze|nad makiet'
    arm: with-only
  - name: mockup-made
    type: llm
    criteria: Odpowiedź po polsku dotyczy makiety modułu Klienci kwiaciarni i prosi użytkownika o jej obejrzenie i odpowiedzi na pytania. Mówi, że pytania są w panelu na górze ekranu. Nie zmienia samodzielnie kolorów ani motywu całej aplikacji (może o to zapytać albo zaproponować).
