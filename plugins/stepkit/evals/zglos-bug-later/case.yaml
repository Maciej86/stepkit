schema_version: "1.1"
name: zglos-bug-later
description: Błąd zgłoszony z prośbą „na później” trafia do docs/FIXES.md zamiast natychmiastowej naprawy.
runs: 2
execution:
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  append_system_prompt: "Środowisko testowe stepkit: komendy (npm, docker, git) są niedostępne, a node_modules nie są zainstalowane. Zakładaj, że npm run check przechodzi po poprawnych zmianach, i pracuj dalej na plikach."
  prompt: "/stepkit:zglos W stopce jest zły rok, pokazuje 2025 zamiast bieżącego. Zawsze, na każdej stronie. Napraw to na później, po logowaniu."
context:
  scaffold_script: fixture.sh
graders:
  - name: mentions-fixes-file
    type: regex
    pattern: 'FIXES\.md'
    arm: with-only
  - name: parks-bug-in-fixes
    type: llm
    criteria: Odpowiedź po polsku traktuje to jako błąd w module Wygląd i potwierdza zapis w docs/FIXES.md (rodzaj błąd, status czeka) do naprawy po zamknięciu Logowania. Nie naprawia teraz kodu stopki, nie zapisuje tego w IDEAS.md i nie dodaje nowego modułu.
