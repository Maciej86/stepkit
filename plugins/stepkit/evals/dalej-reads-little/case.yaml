schema_version: "1.1"
name: dalej-reads-little
description: Czyta stan, spec ogólny i pliki tylko bieżącego modułu.
runs: 2
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: /stepkit:dalej
context:
  scaffold_script: fixture.sh
graders:
  - name: reads-status
    type: tool_used
    tool: Read
    input_match: 'docs/STATUS\.md'
    arm: with-only
  - name: no-other-modules
    type: tool_used
    tool: Read
    input_match: 'docs/modules/(customers|orders)/'
    min: 0
    max: 0
    arm: with-only
