schema_version: "1.1"
name: dalej-writes-tests
description: Na etapie implementacji najpierw powstaje test.
runs: 2
execution:
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: "/stepkit:dalej (zrób tylko krok 1 planu)"
context:
  scaffold_script: fixture.sh
graders:
  - name: writes-test
    type: tool_used
    tool: Write
    input_match: '\.test\.ts'
  - name: test-first
    type: tool_order
    before: { tool: Write, input_match: 'orders\.test\.ts' }
    after: { tool: Write, input_match: 'schemas/orders\.ts' }
