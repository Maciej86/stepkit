schema_version: "1.1"
name: zglos-new-module
description: Zgłoszenie nowej funkcji przez /stepkit:zglos zostaje rozpoznane jako nowy moduł i doprecyzowane pytaniami, zanim cokolwiek trafi do planu.
runs: 2
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  append_system_prompt: "Środowisko testowe stepkit: komendy (npm, docker, git) są niedostępne, a node_modules nie są zainstalowane. Zakładaj, że npm run check przechodzi po poprawnych zmianach, i pracuj dalej na plikach."
  prompt: "/stepkit:zglos Chciałbym, żeby moi pracownicy mogli wpisywać, ile godzin przepracowali."
context:
  scaffold_script: fixture.sh
graders:
  - name: names-new-module
    type: llm
    criteria: Odpowiedź po polsku mówi wprost, że to nowa część aplikacji (nowy moduł), której nie ma w obecnym planie.
  - name: asks-clarifying
    type: llm
    criteria: Odpowiedź zadaje krótkie pytania doprecyzowujące (najwyżej trzy), m.in. kto będzie z tego korzystał (np. czy pracownicy to nowa rola, bo w planie są tylko właściciel i klient) i czy budować to zaraz po bieżącym module, czy na końcu. Pytania mają propozycje odpowiedzi do wyboru. Nie prowadzi pełnego wywiadu o szczegółach ekranów.
  - name: no-build-no-plan-change
    type: llm
    criteria: Odpowiedź nie pisze kodu, nie zaczyna makiety i nie dopisuje jeszcze nowego modułu do listy modułów w STATUS.md (czeka na odpowiedzi użytkownika).
