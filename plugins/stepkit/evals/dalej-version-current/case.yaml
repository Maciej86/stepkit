schema_version: "1.1"
name: dalej-version-current
description: Projekt na wersji równej ostatniemu plikowi aktualizacji (lista w upgrades.md) nie dostaje propozycji aktualizacji, choć „Aktualna wersja stepkit” jest wyższa.
runs: 5
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/stepkit:dalej"
context:
  scaffold_script: fixture.sh
graders:
  - name: no-false-upgrade
    type: llm
    criteria: Odpowiedź po polsku nie twierdzi, że projekt ma starszą wersję stepkit ani że trzeba go zaktualizować, i nie proponuje aktualizacji stepkit (może powiedzieć, że wersja jest aktualna). Kontynuuje moduł Logowanie od kroku 3 z 4 (np. „Jesteśmy przy Logowaniu, implementacja…”).
