schema_version: "1.1"
name: dalej-idea-now
description: Pomysł do zbudowania od razu staje się modułem za bieżącym, po potwierdzeniu nowej kolejności.
runs: 2
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  append_system_prompt: "Środowisko testowe stepkit: komendy (npm, docker, git) są niedostępne, a node_modules nie są zainstalowane. Zakładaj, że npm run check przechodzi po poprawnych zmianach, i pracuj dalej na plikach."
  prompt: "/stepkit:dalej Mam pomysł: ewidencja czasu pracy pracowników. Chcę to zbudować teraz, przed Klientami."
context:
  scaffold_script: fixture.sh
graders:
  - name: proposes-order
    type: llm
    criteria: Odpowiedź po polsku proponuje dopisanie ewidencji czasu pracy jako nowego modułu zaraz za bieżącym modułem Logowanie, a przed Klientami, pokazuje nową kolejność modułów (Logowanie, czas pracy, Klienci) i prosi użytkownika o potwierdzenie. Nie przerywa Logowania (Logowanie zostaje w toku i ma być dokończone najpierw), nie zaczyna budować czasu pracy w tej odpowiedzi i nie odmawia, mówiąc tylko, że pomysł poczeka do końca wszystkich modułów.
